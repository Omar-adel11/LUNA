<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link href="./css/reset.css" rel="stylesheet">
    <link href="./css/variables.css" rel="stylesheet">
    <link href="./css/layout.css" rel="stylesheet">
    <link href="./css/component.css" rel="stylesheet">

    <title>Forget password | Luna App</title>
</head>

<body>

    <main class="main-form-container">

        <!-- Logo -->
        <img
            src="./images/logo.png"
            alt="Luna App Logo"
            class="logo"
        >

        <h1 class="title">
            L<span>U</span>NA
        </h1>


        <h2 class="auth-title">
            Reset Password
        </h2>

      
        
        <div class="form-container">

            <form
                action="#"
                method="post"
                
                id="forget-password-form"
            >

              

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        class="btn"
                    >

                </div>


              

                <!-- Submit -->
                <button
                    type="submit"
                    class="submit-btn"
                >
                    send OTP
                </button>
                <p id="form-status" class="form-status" ></p>
            </form>

        </div>

    </main>
<script type="module" src="./src/pages/forgetPassword.js"></script>
</body>

</html>
