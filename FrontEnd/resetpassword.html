<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link href="./css/reset.css" rel="stylesheet">
    <link href="./css/variables.css" rel="stylesheet">
    <link href="./css/layout.css" rel="stylesheet">
    <link href="./css/component.css" rel="stylesheet">

    <title>Reset Password | Luna App</title>
</head>

<body>

    <main class="main-form-container">

        <img
            src="./images/logo.png"
            alt="Luna App Logo"
            class="logo"
        >

        <h1 class="title">
            L<span>U</span>NA
        </h1>

        <h2 class="auth-title">
            Reset Password
        </h2>

        <p class="auth-description">
            Enter your new password.
        </p>

        <div class="form-container">

            <form
                id="reset-password-form"
                action="#"
                method="post"
            >

                <!-- New Password -->
                <div class="form-group">

                    <label for="new-password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="new-password"
                        name="Password"
                        autocomplete="new-password"
                        required
                        class="btn"
                    >

                </div>

                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="ConfirmPassword"
                        autocomplete="new-password"
                        required
                        class="btn"
                    >

                </div>

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Reset Password
                </button>

                <p
                    id="form-status"
                    class="form-status"
                ></p>

            </form>

        </div>

    </main>

    <script
        type="module"
        src="../FrontEnd/src/pages/resetPassword.js"
    ></script>

</body>

</html>
