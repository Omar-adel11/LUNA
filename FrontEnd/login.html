<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/reset.css" rel="stylesheet">
    <link href="./css/variables.css" rel="stylesheet">
    <link href="./css/layout.css" rel="stylesheet">
    <link href="./css/component.css" rel="stylesheet">
	<title>Login | Luna App</title>
</head>
<body>
	<main class="main-form-container">
            <img src="./images/logo.png" alt="Luna App Logo" class="logo">
            <h1 class="title">L<span>U</span>NA</h1>
			<div class="btn-container">
                <a href="login.html" class="btn-a active">LOGIN</a>
                <a href="register.html" class="btn-a ">REGISTER</a>
            </div>
            <div id="form-container" class="form-container">
                <form method="post" id="login-form">
				<div class="form-group">
					<label for="email">Email address</label>
					<input type="email" id="email" name="email" autocomplete="email" required class="btn">
				
                </div>

				<div class="form-group">
					<label for="password">Password</label>
					<input type="password" id="password" name="password" autocomplete="current-password" required class="btn">
				</div>

				<div>
					<a href="forgetPassword.html" class="forgot-password-link">Forgot password?</a>
				</div>

				<button type="submit" class="submit-btn">Login</button>

				<p id="form-status" class="form-status" ></p>
			</form>
            </div>
	</main>
	<script type="module" src="./src/pages/login.js"></script>
</body>
</html>
