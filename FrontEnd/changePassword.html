<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link href="./css/reset.css" rel="stylesheet">
    <link href="./css/variables.css" rel="stylesheet">
    <link href="./css/layout.css" rel="stylesheet">
    <link href="./css/component.css" rel="stylesheet">

    <title>Reset Password | Luna App</title>
</head>

<body>

    <main class="main-form-container">

        <!-- Logo -->
        <img
            src="./images/logo.png"
            alt="Luna App Logo"
            class="logo"
        >

        <h1 class="title">
            L<span>U</span>NA
        </h1>


        <h2 class="auth-title">
            Forget Password
        </h2>

       


        <!-- Reset Password Form -->
        <div class="form-container">

            <form
                action="#"
                method="post"
                id="change-password-form"
            >

            <!-- old Password -->
                <div class="form-group">

                    <label for="password">
                        Old Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="old-password"
                        required
                        class="btn"
                    >

                </div>

                <!-- New Password -->
                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="newPassword"
                        autocomplete="new-password"
                        required
                        class="btn"
                    >

                </div>


              


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Change Password
                </button>
                <p id="form-status" class="form-status" ></p>
            </form>

        </div>

    </main>
<script type="module" src="./src/pages/changePassword.js"></script>
</body>

</html>
